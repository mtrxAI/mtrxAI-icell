[package]
name = "mtrxai-icell"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mtrxai-icell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
bytes = "1"
dashmap = "6"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "client", "client-legacy", "http1", "http2", "tokio"] }
rcgen = "0.14"
hf-hub = { version = "1", features = ["rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
